<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Rupa Booth</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="windows"></div>

    <!-- Wallpaper Picker App Window -->
    <div id="wallWin" class="window mac-win wall-win" hidden>
      <div class="mac-sidebar">
        <header class="titlebar mac-sb-top">
          <div class="lights">
            <button type="button" class="light close" id="wallClose" title="Close" aria-label="Close"></button>
            <button type="button" class="light min" id="wallMin" title="Minimize" aria-label="Minimize"></button>
            <button type="button" class="light max disabled" aria-hidden="true" tabindex="-1"></button>
          </div>
        </header>

        <div class="mac-sb-preview">
          <div id="wallMiniStage" class="mini-desktop">
            <span class="mini-win"><i></i><i></i><i></i></span>
            <span class="mini-dock"></span>
          </div>
          <span class="mini-cap">Desktop Preview</span>
        </div>

        <div class="mac-sb-label">Source</div>
        <div class="wall-tabs" data-tab="0" role="tablist" aria-label="Wallpaper source">
          <span class="ind"></span>
          <button type="button" class="wall-tab active" data-tab="color" role="tab" aria-selected="true" title="Color">
            <i class="sb-ico sb-color"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg></i><span>Color</span>
          </button>
          <button type="button" class="wall-tab" data-tab="photo" role="tab" aria-selected="false" title="Photo">
            <i class="sb-ico sb-photo"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.2"/><circle cx="9" cy="10" r="1.4" fill="currentColor" stroke="none"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5L19 17"/></svg></i><span>Photo</span>
          </button>
        </div>
      </div>

      <div class="mac-main">
        <header class="titlebar mac-main-top">
          <span class="mac-pane-title" id="wallPaneTitle">Wallpaper</span>
        </header>

        <div class="wall-body">
          <!-- Color picker panel -->
          <div class="wall-pane" id="wallColorPane">
            <div class="sv-wrap">
              <canvas id="svCanvas" width="360" height="150"></canvas>
              <span id="svKnob" class="sv-knob"></span>
            </div>

            <div class="mac-group wall-sliders">
              <label class="mac-row slider-row">
                <span title="Hue">H</span>
                <input id="hueSlider" type="range" min="0" max="360" value="0" class="rng hue" aria-label="Hue" />
                <output id="hueVal">0°</output>
              </label>
              <label class="mac-row slider-row">
                <span title="Saturation">S</span>
                <input id="satSlider" type="range" min="0" max="100" value="0" class="rng sat" aria-label="Saturation" />
                <output id="satVal">0%</output>
              </label>
              <label class="mac-row slider-row">
                <span title="Brightness">B</span>
                <input id="valSlider" type="range" min="0" max="100" value="100" class="rng val" aria-label="Brightness" />
                <output id="valVal">100%</output>
              </label>
              <div class="mac-row hex-row">
                <span>Hex</span>
                <div class="hex-controls">
                  <span id="colorSwatch" class="color-swatch"></span>
                  <label class="hex-field">
                    <input id="hexInput" type="text" value="#FFFFFF" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color" />
                  </label>
                </div>
              </div>
            </div>

            <div class="mac-group swatches-group">
              <div class="presets" id="colorPresets" aria-label="Color presets"></div>
            </div>
          </div>

          <!-- Photo wallpaper panel -->
          <div class="wall-pane" id="wallPhotoPane" hidden>
            <div class="wall-drop" id="wallDrop">
              <img id="wallThumb" alt="" hidden />
              <div class="wall-drop-msg" id="wallDropMsg">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.7"/><path d="M4 18l5.5-5.5 3.5 3.5 2.5-2.5L20 18"/></svg>
                <span>Drop or upload image</span>
              </div>
            </div>

            <input id="wallFile" type="file" accept="image/*" hidden />

            <div class="mac-group">
              <div class="mac-row">
                <span>Image</span>
                <div class="wall-photo-actions">
                  <button type="button" id="wallUploadBtn" class="btn icon-btn primary" title="Choose Photo" aria-label="Choose Photo">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5m0 0l-4 4m4-4l4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                  </button>
                  <button type="button" id="wallClearBtn" class="btn icon-btn danger" title="Remove Photo" aria-label="Remove Photo" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
                  </button>
                </div>
              </div>
              <div class="mac-row wall-fit-row" id="wallFitRow">
                <span>Fit</span>
                <div class="fit-seg">
                  <button type="button" data-fit="cover" class="active" title="Fill" aria-label="Fill">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 10L6 7m0 0h3m-3 0v3M15 14l3 3m0 0h-3m3 0v-3"/></svg>
                  </button>
                  <button type="button" data-fit="contain" title="Fit" aria-label="Fit">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><rect x="7.5" y="8" width="9" height="8" rx="1" fill="currentColor" opacity=".35"/></svg>
                  </button>
                  <button type="button" data-fit="100% 100%" title="Stretch" aria-label="Stretch">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M7 12h10m-10 0l2-2m-2 2l2 2m8-2l-2-2m2 2l-2 2"/></svg>
                  </button>
                  <button type="button" data-fit="auto" title="Center" aria-label="Center">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings App Window -->
    <div id="settingsWin" class="window mac-win settings-win" hidden>
      <div class="mac-sidebar">
        <header class="titlebar mac-sb-top">
          <div class="lights">
            <button type="button" class="light close" id="settingsClose" title="Close" aria-label="Close"></button>
            <button type="button" class="light min" id="settingsMin" title="Minimize" aria-label="Minimize"></button>
            <button type="button" class="light max disabled" aria-hidden="true" tabindex="-1"></button>
          </div>
        </header>

        <div class="mac-sb-label">Settings</div>
        <nav class="mac-sb-nav" id="settingsNav" role="tablist" aria-label="Settings sections">
          <button type="button" class="sb-nav-btn active" data-sec="layout" role="tab" aria-selected="true">
            <i class="sb-ico sb-layout"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></svg></i><span>Layout</span>
          </button>
          <button type="button" class="sb-nav-btn" data-sec="about" role="tab" aria-selected="false">
            <i class="sb-ico sb-about"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.2"/><path d="M6.5 19c.9-2.8 3-4.2 5.5-4.2s4.6 1.4 5.5 4.2"/></svg></i><span>About</span>
          </button>
        </nav>
      </div>

      <div class="mac-main">
        <header class="titlebar mac-main-top">
          <span class="mac-pane-title" id="settingsPaneTitle">Layout</span>
        </header>

        <div class="util-body">
          <section class="set-pane" id="setPaneLayout">
            <div id="layoutGrid" class="layout-grid" role="radiogroup" aria-label="Photo Booth window layouts"></div>
          </section>

          <section class="set-pane" id="setPaneAbout" hidden>
            <div class="mac-group about-hero">
              <div class="about-badge">RB</div>
              <div class="about-hero-text">
                <h4>Rupa Booth</h4>
                <p>macOS Multi-Window Studio · WebGL</p>
              </div>
            </div>
            <div class="mac-group">
              <div class="mac-row">
                <span>Creator</span>
                <a class="ig-btn" href="https://www.instagram.com/pondithekid/" target="_blank" rel="noopener noreferrer" title="Instagram @pondithekid">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/>
                  </svg>
                  <span>@pondithekid</span>
                </a>
              </div>
              <div class="mac-row">
                <span>Layouts</span>
                <span class="muted-val">1 – 5 Windows</span>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- Files App Window -->
    <div id="filesWin" class="window mac-win files-win" hidden>
      <div class="mac-sidebar">
        <header class="titlebar mac-sb-top">
          <div class="lights">
            <button type="button" class="light close" id="filesClose" title="Close" aria-label="Close"></button>
            <button type="button" class="light min" id="filesMin" title="Minimize" aria-label="Minimize"></button>
            <button type="button" class="light max disabled" aria-hidden="true" tabindex="-1"></button>
          </div>
        </header>

        <div class="mac-sb-label">Library</div>
        <div class="files-tabs" id="filesTabs" role="tablist" aria-label="Filter files">
          <button type="button" class="ftab active" data-filter="all" role="tab" aria-selected="true">
            <i class="sb-ico sb-all"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"/></svg></i><span>All</span><em data-count="all">0</em>
          </button>
          <button type="button" class="ftab" data-filter="photo" role="tab" aria-selected="false">
            <i class="sb-ico sb-photo"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.2"/><circle cx="9" cy="10" r="1.4" fill="currentColor" stroke="none"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5L19 17"/></svg></i><span>Photos</span><em data-count="photo">0</em>
          </button>
          <button type="button" class="ftab" data-filter="video" role="tab" aria-selected="false">
            <i class="sb-ico sb-video"><svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="12.5" height="11" rx="2.2"/><path d="M16 10.2l5-3v9.6l-5-3"/></svg></i><span>Videos</span><em data-count="video">0</em>
          </button>
          <button type="button" class="ftab" data-filter="screenshot" role="tab" aria-selected="false">
            <i class="sb-ico sb-shot"><svg viewBox="0 0 24 24"><path d="M6 8V6a2 2 0 0 1 2-2h2m4 0h2a2 2 0 0 1 2 2v2m0 8v2a2 2 0 0 1-2 2h-2m-4 0H8a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg></i><span>Shots</span><em data-count="screenshot">0</em>
          </button>
        </div>
      </div>

      <div class="mac-main">
        <header class="titlebar mac-main-top">
          <span class="mac-pane-title" id="filesPaneTitle">All</span>
        </header>

        <div class="files-body">
          <div id="filesGrid" class="files-grid"></div>
          <div id="filesEmpty" class="files-empty" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4.6l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
            <span>Empty Library</span>
          </div>

          <div id="filesPreview" class="files-preview" hidden>
            <div class="fp-top">
              <button type="button" id="fpBack" class="btn icon-btn fp-back" title="Back" aria-label="Back">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <span id="fpMeta" class="fp-meta"></span>
              <div class="fp-actions">
                <button type="button" id="fpWall" class="btn icon-btn fp-wall" title="Set as Wallpaper" aria-label="Set as Wallpaper">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2.5"/><path d="M3 15l4.5-4.5a1.5 1.5 0 0 1 2.1 0L14 15l2.5-2.5a1.5 1.5 0 0 1 2.1 0L21 15"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><path d="M8 21h8"/></svg>
                </button>
                <button type="button" id="fpDl" class="btn icon-btn primary" title="Download" aria-label="Download">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                </button>
                <button type="button" id="fpDel" class="btn icon-btn danger" title="Delete" aria-label="Delete">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
                </button>
              </div>
            </div>
            <div class="fp-media">
              <img id="fpImg" alt="" hidden />
              <video id="fpVideo" controls playsinline hidden></video>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Screenshot countdown overlay -->
    <div id="shotCountdown" hidden>
      <span id="shotCountNum">3</span>
    </div>

    <!-- macOS-style bottom-right screenshot preview -->
    <div id="shotToast" hidden role="button" tabindex="0" title="Open in Files" aria-label="Open screenshot in Files">
      <img id="shotPreview" alt="Screenshot preview" />
      <button type="button" id="shotToastClose" class="shot-toast-act close" title="Dismiss" aria-label="Dismiss preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
      <button type="button" id="shotToastDl" class="shot-toast-act dl" title="Download PNG" aria-label="Download PNG">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>
      </button>
    </div>

    <!-- macOS-style Dock -->
    <nav id="dock" aria-label="Dock">
      <button type="button" id="dockApp" class="dock-item" aria-label="Photo Booth">
        <span class="dock-tip">Photo Booth</span>
        <svg class="dock-icon" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="pbBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f7f7fa"/>
              <stop offset="100%" stop-color="#d8d8e0"/>
            </linearGradient>
            <linearGradient id="pbCurtain" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff4d42"/>
              <stop offset="55%" stop-color="#d41910"/>
              <stop offset="100%" stop-color="#8c0b05"/>
            </linearGradient>
            <linearGradient id="pbBooth" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#35363c"/>
              <stop offset="100%" stop-color="#191a1e"/>
            </linearGradient>
            <linearGradient id="pbGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff" stop-opacity=".42"/>
              <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pbBg)"/>
          <rect x="5" y="5" width="54" height="54" rx="11" fill="url(#pbBooth)"/>
          <rect x="17" y="13" width="13.5" height="17" rx="2.5" fill="#5ac8fa"/>
          <rect x="33.5" y="13" width="13.5" height="17" rx="2.5" fill="#ffcc00"/>
          <rect x="17" y="33" width="13.5" height="17" rx="2.5" fill="#ff6482"/>
          <rect x="33.5" y="33" width="13.5" height="17" rx="2.5" fill="#64d2ff"/>
          <circle cx="23.75" cy="19.5" r="3" fill="rgba(255,255,255,.85)"/>
          <path d="M19 28c.8-3 2.5-4.3 4.75-4.3S27.7 25 28.5 28" fill="rgba(255,255,255,.85)"/>
          <circle cx="40.25" cy="19.5" r="3" fill="rgba(255,255,255,.85)"/>
          <path d="M35.5 28c.8-3 2.5-4.3 4.75-4.3S44.2 25 45 28" fill="rgba(255,255,255,.85)"/>
          <circle cx="23.75" cy="39.5" r="3" fill="rgba(255,255,255,.85)"/>
          <path d="M19 48c.8-3 2.5-4.3 4.75-4.3S27.7 45 28.5 48" fill="rgba(255,255,255,.85)"/>
          <circle cx="40.25" cy="39.5" r="3" fill="rgba(255,255,255,.85)"/>
          <path d="M35.5 48c.8-3 2.5-4.3 4.75-4.3S44.2 45 45 48" fill="rgba(255,255,255,.85)"/>
          <path d="M5 16c0-6.1 4.9-11 11-11h32c6.1 0 11 4.9 11 11v2c-4.5 2-9 2.5-13.5 0-4.5 2.5-9 2.5-13.5 0-4.5 2.5-9 2.5-13.5 0-4.5 2.5-9 2-13.5 0v-2z" fill="url(#pbCurtain)"/>
          <path d="M5 16h9v32c0 6.1-3.5 11-9 11V16z" fill="url(#pbCurtain)" opacity=".92"/>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pbGloss)"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="rgba(0,0,0,.12)"/>
        </svg>
        <i class="dock-dot"></i>
      </button>

      <button type="button" id="dockWall" class="dock-item" aria-label="Wallpaper">
        <span class="dock-tip">Wallpaper</span>
        <svg class="dock-icon" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="wlSky" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4facfe"/>
              <stop offset="48%" stop-color="#a18cd1"/>
              <stop offset="100%" stop-color="#fbc2eb"/>
            </linearGradient>
            <linearGradient id="wlHill1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5e60ce"/>
              <stop offset="100%" stop-color="#2b2d42"/>
            </linearGradient>
            <linearGradient id="wlHill2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff758c"/>
              <stop offset="100%" stop-color="#ff7eb3"/>
            </linearGradient>
            <linearGradient id="wlGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff" stop-opacity=".38"/>
              <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wlSky)"/>
          <circle cx="45" cy="18" r="6" fill="#fff7d6" opacity=".92"/>
          <path d="M2 40c12-10 24-6 36 2 8 5 16 4 24-3v9c0 7.7-6.3 14-14 14H16C8.3 62 2 55.7 2 48v-8z" fill="url(#wlHill2)" opacity=".88"/>
          <path d="M2 46c14-9 28-3 42 5 6 3.5 12 2.5 18-1v-2c0 7.7-6.3 14-14 14H16C8.3 62 2 55.7 2 48v-2z" fill="url(#wlHill1)"/>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wlGloss)"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="rgba(0,0,0,.12)"/>
        </svg>
        <i class="dock-dot"></i>
      </button>

      <button type="button" id="dockFiles" class="dock-item" aria-label="Files">
        <span class="dock-tip">Files</span>
        <svg class="dock-icon" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="flBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f5f7fb"/>
              <stop offset="100%" stop-color="#d9dfea"/>
            </linearGradient>
            <linearGradient id="flBack" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3fa9f5"/>
              <stop offset="100%" stop-color="#1976d2"/>
            </linearGradient>
            <linearGradient id="flFront" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7cd3ff"/>
              <stop offset="55%" stop-color="#2ea3f8"/>
              <stop offset="100%" stop-color="#1473d1"/>
            </linearGradient>
            <linearGradient id="flGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff" stop-opacity=".4"/>
              <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#flBg)"/>
          <path d="M12 18c0-2.2 1.8-4 4-4h10.5c1.5 0 2.9.8 3.6 2.1l1.2 1.9H48c2.2 0 4 1.8 4 4v24c0 2.2-1.8 4-4 4H16c-2.2 0-4-1.8-4-4V18z" fill="url(#flBack)"/>
          <rect x="14" y="21" width="36" height="5" rx="2" fill="rgba(255,255,255,.78)"/>
          <rect x="12" y="24" width="40" height="26" rx="4" fill="url(#flFront)"/>
          <rect x="12" y="24" width="40" height="1.4" rx=".7" fill="rgba(255,255,255,.5)"/>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#flGloss)"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="rgba(0,0,0,.12)"/>
        </svg>
        <i class="dock-dot"></i>
      </button>

      <button type="button" id="dockSettings" class="dock-item" aria-label="Settings">
        <span class="dock-tip">Settings</span>
        <svg class="dock-icon" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="stBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#adb5c2"/>
              <stop offset="100%" stop-color="#5d6470"/>
            </linearGradient>
            <linearGradient id="stGear" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f3f4f6"/>
              <stop offset="100%" stop-color="#9ca3af"/>
            </linearGradient>
            <linearGradient id="stGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff" stop-opacity=".35"/>
              <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#stBg)"/>
          <circle cx="32" cy="32" r="21" fill="#2d3138"/>
          <path d="M35.2 13.5l1 4.2a14.4 14.4 0 0 1 3.7 1.5l3.7-2.2 4.5 4.5-2.2 3.7a14.4 14.4 0 0 1 1.5 3.7l4.2 1v6.2l-4.2 1a14.4 14.4 0 0 1-1.5 3.7l2.2 3.7-4.5 4.5-3.7-2.2a14.4 14.4 0 0 1-3.7 1.5l-1 4.2h-6.4l-1-4.2a14.4 14.4 0 0 1-3.7-1.5l-3.7 2.2-4.5-4.5 2.2-3.7a14.4 14.4 0 0 1-1.5-3.7l-4.2-1v-6.2l4.2-1a14.4 14.4 0 0 1 1.5-3.7l-2.2-3.7 4.5-4.5 3.7 2.2a14.4 14.4 0 0 1 3.7-1.5l1-4.2h6.4z" fill="url(#stGear)"/>
          <circle cx="32" cy="32" r="7.5" fill="#2d3138" stroke="#d1d5db" stroke-width="2"/>
          <circle cx="32" cy="32" r="3.2" fill="#9ca3af"/>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#stGloss)"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="rgba(0,0,0,.18)"/>
        </svg>
        <i class="dock-dot"></i>
      </button>

      <button type="button" id="dockShot" class="dock-item" aria-label="Screenshot">
        <span class="dock-tip">Screenshot</span>
        <svg class="dock-icon" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="scBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#52555e"/>
              <stop offset="100%" stop-color="#272930"/>
            </linearGradient>
            <linearGradient id="scLens" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="55%" stop-color="#2563eb"/>
              <stop offset="100%" stop-color="#1e1b4b"/>
            </linearGradient>
            <linearGradient id="scGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff" stop-opacity=".3"/>
              <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#scBg)"/>
          <path d="M13 21v-5a3 3 0 0 1 3-3h5M43 13h5a3 3 0 0 1 3 3v5M51 43v5a3 3 0 0 1-3 3h-5M21 51h-5a3 3 0 0 1-3-3v-5" fill="none" stroke="rgba(255,255,255,.82)" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M23 23l2.2-3h13.6l2.2 3H44a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V27a4 4 0 0 1 4-4h3z" fill="#e5e7eb"/>
          <circle cx="32" cy="34" r="6.8" fill="url(#scLens)" stroke="#1f2937" stroke-width="2"/>
          <circle cx="29.8" cy="31.8" r="1.8" fill="#fff" opacity=".75"/>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#scGloss)"/>
          <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="rgba(0,0,0,.18)"/>
        </svg>
      </button>

      <div id="dockDivider" class="dock-divider" hidden></div>
      <div id="dockMin" class="dock-min"></div>
    </nav>
  </div>

  <!-- Photo Booth Window template -->
  <template id="winTpl">
    <div class="window lib-empty">
      <header class="titlebar">
        <div class="lights">
          <button type="button" class="light close" title="Close" aria-label="Close"></button>
          <button type="button" class="light min" title="Minimize" aria-label="Minimize"></button>
          <button type="button" class="light max" title="Full screen" aria-label="Full screen"></button>
        </div>
        <input class="title-input" type="text" value="Photo Booth" maxlength="40" spellcheck="false"
               autocomplete="off" title="Click to rename" aria-label="Window title" />
        <span class="tb-spacer"></span>
      </header>

      <main class="stage">
        <canvas class="view"></canvas>

        <div class="viewer" hidden>
          <img class="viewer-img" alt="" hidden />
          <video class="viewer-video" controls playsinline hidden></video>
          <div class="viewer-actions">
            <button type="button" class="btn icon-btn dl-btn" title="Download" aria-label="Download">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            </button>
            <button type="button" class="btn icon-btn danger del-btn" title="Delete" aria-label="Delete">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
            </button>
            <button type="button" class="btn icon-btn viewer-close-btn" title="Live Camera" aria-label="Back to live camera">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>

        <div class="effects" hidden>
          <div class="fx-track"></div>
          <button type="button" class="fx-nav prev off" aria-label="Previous page">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button type="button" class="fx-nav next" aria-label="Next page">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <div class="fx-dots"></div>
        </div>

        <div class="countdown" hidden></div>
        <div class="rec-badge" hidden><i></i><span class="rec-time">0:00</span></div>
        <div class="message" hidden></div>
      </main>

      <section class="library" aria-label="Library"></section>

      <footer class="toolbar">
        <div class="modes" data-active="1" role="group" aria-label="Capture mode">
          <span class="ind"></span>
          <button type="button" class="mode" data-mode="4up" title="Take four quick photos">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.4"/></svg>
          </button>
          <button type="button" class="mode" data-mode="photo" title="Take a single photo">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.6"/><circle cx="12" cy="10.2" r="2.6"/><path d="M7 18.5c.8-2.6 2.8-3.8 5-3.8s4.2 1.2 5 3.8"/></svg>
          </button>
          <button type="button" class="mode" data-mode="video" title="Record a movie clip">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.6"/><path d="M16.5 10.4 21.5 7.2v9.6l-5-3.2z"/></svg>
          </button>
        </div>

        <button class="shutter" type="button" data-mode="photo" title="Take photo (Space) — Option-click to skip countdown">
          <svg class="ico-photo" viewBox="0 0 24 24"><path d="M9 4 7.6 6H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2.6L15 4z"/><circle cx="12" cy="12.5" r="3.6" class="lens"/></svg>
          <svg class="ico-video" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M16.5 10.2 21.5 7v10l-5-3.2z"/></svg>
          <svg class="ico-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
        </button>

        <div class="right">
          <button type="button" class="btn icon-btn effects-btn" title="Effects" aria-label="Effects" aria-pressed="false">
            <svg class="ico-fx" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="9" r="4.5"/><circle cx="8.8" cy="14.5" r="4.5"/><circle cx="15.2" cy="14.5" r="4.5"/>
            </svg>
            <svg class="ico-done" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 12.5l4.2 4.2L18.5 7.5"/>
            </svg>
          </button>
        </div>
      </footer>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
